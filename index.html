<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball Defensive Coach Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div id="root"></div>

    <script type="text/babel">
        const initialPositions = {
            pitcher: { x: 350, y: 308, label: 'P' },
            catcher: { x: 350, y: 455, label: 'C' },
            first: { x: 450, y: 275, label: '1B' },
            second: { x: 400, y: 205, label: '2B' },
            third: { x: 250, y: 275, label: '3B' },
            shortstop: { x: 300, y: 205, label: 'SS' },
            left: { x: 225, y: 125, label: 'LF' },
            center: { x: 350, y: 75, label: 'CF' },
            right: { x: 475, y: 125, label: 'RF' },
            baseball: { x: 400, y: 425, label: '⚾' },
            runner1: { x: 450, y: 425, label: 'BR' },
            runner2: { x: 500, y: 425, label: 'BR' },
            runner3: { x: 550, y: 425, label: 'BR' }
        };

        function DraggableMarker({ id, x, y, label, color, onDrag }) {
            const [isDragging, setIsDragging] = React.useState(false);

            const handleMouseDown = (e) => {
                setIsDragging(true);
                e.preventDefault();
                e.stopPropagation();
            };

            const handleMouseMove = React.useCallback((e) => {
                if (isDragging) {
                    const svg = document.querySelector('svg');
                    const pt = svg.createSVGPoint();
                    pt.x = e.clientX;
                    pt.y = e.clientY;
                    const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                    onDrag(id, transformed.x, transformed.y);
                }
            }, [isDragging, id, onDrag]);

            const handleMouseUp = React.useCallback(() => {
                setIsDragging(false);
            }, []);

            React.useEffect(() => {
                if (isDragging) {
                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                }
                return () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isDragging, handleMouseMove, handleMouseUp]);

            return (
                <g onMouseDown={handleMouseDown} className="cursor-move">
                    <circle 
                        cx={x} 
                        cy={y} 
                        r={id === 'baseball' ? 10 : 15} 
                        fill={color} 
                        stroke="white" 
                        strokeWidth="2"
                    />
                    {label && (
                        <text 
                            x={x} 
                            y={y + (id === 'baseball' ? 4 : 5)} 
                            textAnchor="middle" 
                            fill="white" 
                            fontSize={id === 'baseball' ? 14 : 12}
                        >
                            {label}
                        </text>
                    )}
                </g>
            );
        }

        function BaseballField() {
            const [positions, setPositions] = React.useState(initialPositions);
            const [playName, setPlayName] = React.useState('');
            const [savedPlays, setSavedPlays] = React.useState([]);
            const [isSolidMode, setIsSolidMode] = React.useState(false);
            const [isDottedMode, setIsDottedMode] = React.useState(false);
            const [drawing, setDrawing] = React.useState(false);
            const [currentLine, setCurrentLine] = React.useState(null);
            const [lines, setLines] = React.useState([]);

            const handleDrag = (id, newX, newY) => {
                setPositions(prev => ({
                    ...prev,
                    [id]: { ...prev[id], x: newX, y: newY }
                }));
            };

            const savePlay = () => {
                if (playName) {
                    setSavedPlays(prev => [...prev, { name: playName, positions: { ...positions }, lines: [...lines] }]);
                    setPlayName('');
                }
            };

            const loadPlay = (play) => {
                setPositions(play.positions);
                setLines(play.lines || []);
            };

            const resetPositions = () => {
                setPositions(initialPositions);
                setLines([]);
                setDrawing(false);
                setCurrentLine(null);
                setIsSolidMode(false);
                setIsDottedMode(false);
            };

            const toggleSolidMode = () => {
                setIsSolidMode(prev => !prev);
                if (isDottedMode) setIsDottedMode(false);
            };

            const toggleDottedMode = () => {
                setIsDottedMode(prev => !prev);
                if (isSolidMode) setIsSolidMode(false);
            };

            const handleMouseDown = (e) => {
                if (!isSolidMode && !isDottedMode) return;

                const svg = e.currentTarget;
                const pt = svg.createSVGPoint();
                pt.x = e.clientX;
                pt.y = e.clientY;
                const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                
                setDrawing(true);
                setCurrentLine({
                    start: { x: transformed.x, y: transformed.y },
                    end: { x: transformed.x, y: transformed.y },
                    type: isSolidMode ? 'solid' : 'dotted'
                });
            };

            const handleMouseMove = (e) => {
                if (drawing) {
                    const svg = document.querySelector('svg');
                    const pt = svg.createSVGPoint();
                    pt.x = e.clientX;
                    pt.y = e.clientY;
                    const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                    
                    setCurrentLine(prev => ({
                        ...prev,
                        end: { x: transformed.x, y: transformed.y }
                    }));
                }
            };

            const handleMouseUp = () => {
                if (drawing && currentLine) {
                    setLines(prev => [...prev, currentLine]);
                    setDrawing(false);
                    setCurrentLine(null);
                }
            };

            const clearLines = () => {
                setLines([]);
                setDrawing(false);
                setCurrentLine(null);
            };

            return (
                <div className="bg-white p-6 rounded-lg shadow-lg w-full max-w-4xl">
                    <h1 className="text-2xl font-bold mb-4 text-center">Baseball Defensive Coach Tool</h1>
                    
                    <div className="mb-4 flex gap-4">
                        <input 
                            type="text" 
                            value={playName}
                            onChange={(e) => setPlayName(e.target.value)}
                            placeholder="Enter play name"
                            className="border p-2 rounded flex-1"
                        />
                        <button 
                            onClick={savePlay}
                            className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                        >
                            Save Play
                        </button>
                        <button 
                            onClick={resetPositions}
                            className="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
                        >
                            Reset
                        </button>
                    </div>

                    <div className="mb-4 flex gap-4 justify-center">
                        <button
                            onClick={toggleSolidMode}
                            className={`px-4 py-2 rounded ${isSolidMode ? 'bg-green-500 text-white' : 'bg-gray-200'}`}
                        >
                            Solid Line {isSolidMode ? '(On)' : '(Off)'}
                        </button>
                        <button
                            onClick={toggleDottedMode}
                            className={`px-4 py-2 rounded ${isDottedMode ? 'bg-green-500 text-white' : 'bg-gray-200'}`}
                        >
                            Dotted Line {isDottedMode ? '(On)' : '(Off)'}
                        </button>
                        <button
                            onClick={clearLines}
                            className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
                        >
                            Clear Lines
                        </button>
                    </div>

                    <svg 
                        width="700" 
                        height="500" 
                        viewBox="150 25 400 450" 
                        className="border mx-auto" 
                        style={{ backgroundColor: 'rgba(0, 128, 0, 0.6)' }} 
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                    >
                        {/* Arrowhead Definition */}
                        <defs>
                            <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                                <path d="M0,0 L0,6 L9,3 Z" fill="black" />
                            </marker>
                        </defs>
                        {/* Dirt Infield */}
                        <path 
                            d="M 350 425 L 200 275 Q 250 175 350 175 Q 450 175 500 275 L 350 425 Z" 
                            fill="burlywood"
                        />
                        {/* Grass Diamond */}
                        <path 
                            d="M 350 425 L 250 325 L 350 225 L 450 325 Z" 
                            fill="rgba(0, 128, 0, 0.6)"
                        />
                        {/* Pitching Mound */}
                        <circle cx="350" cy="325" r="20" fill="burlywood" />
                        {/* Pitcher's Rubber */}
                        <rect x="340" y="320" width="20" height="5" fill="white" />
                        {/* Bases */}
                        {/* Home Plate */}
                        <path 
                            d="M 340 417 L 360 417 L 360 429 L 350 433 L 340 429 Z" 
                            fill="white"
                        />
                        <rect x="240" y="315" width="15" height="15" fill="white" transform="rotate(45 250 325)" />
                        <rect x="340" y="215" width="15" height="15" fill="white" transform="rotate(45 350 225)" />
                        <rect x="440" y="315" width="15" height="15" fill="white" transform="rotate(45 450 325)" />
                        {/* Base Lines */}
                        <line x1="350" y1="425" x2="250" y2="325" stroke="white" strokeWidth="2" />
                        <line x1="250" y1="325" x2="350" y2="225" stroke="white" strokeWidth="2" />
                        <line x1="350" y1="225" x2="450" y2="325" stroke="white" strokeWidth="2" />
                        <line x1="450" y1="325" x2="350" y2="425" stroke="white" strokeWidth="2" />
                        {/* Drawn Lines */}
                        {lines.map((line, index) => (
                            <g key={index}>
                                <line
                                    x1={line.start.x}
                                    y1={line.start.y}
                                    x2={line.end.x}
                                    y2={line.end.y}
                                    stroke="black"
                                    strokeWidth="2"
                                    strokeDasharray={line.type === 'dotted' ? '5,5' : 'none'}
                                    markerEnd="url(#arrow)"
                                />
                            </g>
                        ))}
                        {/* Current Line Being Drawn */}
                        {currentLine && (
                            <g>
                                <line
                                    x1={currentLine.start.x}
                                    y1={currentLine.start.y}
                                    x2={currentLine.end.x}
                                    y2={currentLine.end.y}
                                    stroke="black"
                                    strokeWidth="2"
                                    strokeDasharray={currentLine.type === 'dotted' ? '5,5' : 'none'}
                                    markerEnd="url(#arrow)"
                                />
                            </g>
                        )}
                        {/* Draggable Elements */}
                        {Object.entries(positions).map(([id, { x, y, label }]) => (
                            <DraggableMarker 
                                key={id} 
                                id={id} 
                                x={x} 
                                y={y} 
                                label={label}
                                color={id === 'baseball' ? 'white' : id.includes('runner') ? 'black' : 'red'}
                                onDrag={handleDrag}
                            />
                        ))}
                    </svg>

                    <div className="mt-4">
                        <h2 className="text-lg font-semibold">Saved Plays</h2>
                        <div className="grid grid-cols-2 gap-2 mt-2">
                            {savedPlays.map((play, index) => (
                                <button 
                                    key={index}
                                    onClick={() => loadPlay(play)}
                                    className="bg-gray-200 p-2 rounded hover:bg-gray-300 text-left"
                                >
                                    {play.name}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BaseballField />);
    </script>
</body>
</html>
