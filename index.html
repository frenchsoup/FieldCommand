<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-[1200px] mx-auto p-4 md:p-6">
        <div id="root" role="application" aria-label="FieldCommand Baseball Defense Planner"></div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        let stripe;
        const stripePromise = new Promise((resolve) => {
            const checkStripe = () => {
                if (window.Stripe) {
                    stripe = window.Stripe('pk_test_51RBeP6B311TbF66104ceu6MjOAU7FBEHtNyrCccF93ZJNgj4QGQPirUo28iyaWewu6xX9frkQrEwCR2kVdQb5XrC00aNVEvPJ5');
                    resolve(stripe);
                } else {
                    setTimeout(checkStripe, 100);
                }
            };
            checkStripe();
        });

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const initialPositions = {
            pitcher: { x: 350, y: 308, label: 'P' },
            catcher: { x: 350, y: 455, label: 'C' },
            first: { x: 450, y: 275, label: '1B' },
            second: { x: 400, y: 205, label: '2B' },
            third: { x: 250, y: 275, label: '3B' },
            shortstop: { x: 300, y: 205, label: 'SS' },
            left: { x: 225, y: 125, label: 'LF' },
            center: { x: 350, y: 75, label: 'CF' },
            right: { x: 475, y: 125, label: 'RF' },
            baseball: { x: 450, y: 410, label: '⚾' },
            runner1: { x: 485, y: 410, label: 'BR' },
            runner2: { x: 520, y: 410, label: 'BR' },
            runner3: { x: 485, y: 445, label: 'BR' },
            runner4: { x: 520, y: 445, label: 'BR' }
        };

        function DraggableMarker({ id, x, y, label, color, onDrag }) {
            const [isDragging, setIsDragging] = useState(false);

            const getClientPosition = (e) => {
                const isTouch = e.type.startsWith('touch');
                return {
                    x: isTouch ? e.touches[0].clientX : e.clientX,
                    y: isTouch ? e.touches[0].clientY : e.clientY
                };
            };

            const handleStart = (e) => {
                setIsDragging(true);
                e.preventDefault();
                e.stopPropagation();
            };

            const handleMove = React.useCallback((e) => {
                if (isDragging) {
                    const { x, y } = getClientPosition(e);
                    const svg = document.querySelector('svg');
                    const pt = svg.createSVGPoint();
                    pt.x = x;
                    pt.y = y;
                    const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                    onDrag(id, transformed.x, transformed.y);
                    e.preventDefault();
                }
            }, [isDragging, id, onDrag]);

            const handleEnd = React.useCallback((e) => {
                setIsDragging(false);
                e.preventDefault();
            }, []);

            useEffect(() => {
                if (isDragging) {
                    document.addEventListener('mousemove', handleMove);
                    document.addEventListener('mouseup', handleEnd);
                    document.addEventListener('touchmove', handleMove, { passive: false });
                    document.addEventListener('touchend', handleEnd);
                }
                return () => {
                    document.removeEventListener('mousemove', handleMove);
                    document.removeEventListener('mouseup', handleEnd);
                    document.removeEventListener('touchmove', handleMove);
                    document.removeEventListener('touchend', handleEnd);
                };
            }, [isDragging, handleMove, handleEnd]);

            return (
                <g 
                    onMouseDown={handleStart} 
                    onTouchStart={handleStart} 
                    className="cursor-move touch-none"
                    tabIndex="0"
                    role="button"
                    aria-label={`${label} marker at position ${x},${y}`}
                    onKeyDown={(e) => e.key === 'Enter' && handleStart(e)}
                >
                    <circle 
                        cx={x} 
                        cy={y} 
                        r={id === 'baseball' ? 10 : 15} 
                        fill={color} 
                        stroke="white" 
                        strokeWidth="2"
                    />
                    {label && (
                        <text 
                            x={x} 
                            y={y + (id === 'baseball' ? 4 : 5)} 
                            textAnchor="middle" 
                            fill="white" 
                            fontSize={id === 'baseball' ? 14 : 12}
                        >
                            {label}
                        </text>
                    )}
                </g>
            );
        }

        function BaseballField() {
            const [positions, setPositions] = useState(initialPositions);
            const [playName, setPlayName] = useState('');
            const [savedPlays, setSavedPlays] = useState(JSON.parse(localStorage.getItem('savedPlays')) || []);
            const [isSolidMode, setIsSolidMode] = useState(false);
            const [isDottedMode, setIsDottedMode] = useState(false);
            const [drawing, setDrawing] = useState(false);
            const [currentLine, setCurrentLine] = useState(null);
            const [lines, setLines] = useState([]);
            const [showPremiumModal, setShowPremiumModal] = useState(false);
            const [showNotesModal, setShowNotesModal] = useState(false);
            const [currentPlayIndex, setCurrentPlayIndex] = useState(null);
            const [currentNotes, setCurrentNotes] = useState('');
            const [isPremium, setIsPremium] = useState(localStorage.getItem('isPremium') === 'true');
            const [showWelcomeModal, setShowWelcomeModal] = useState(!localStorage.getItem('fieldCommandUnlocked'));
            const [isDemoMode, setIsDemoMode] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');

            const getClientPosition = (e) => {
                const isTouch = e.type.startsWith('touch');
                return {
                    x: isTouch ? e.touches[0].clientX : e.clientX,
                    y: isTouch ? e.touches[0].clientY : e.clientY
                };
            };

            const handleTryNow = () => {
                localStorage.setItem('fieldCommandUnlocked', 'true');
                setShowWelcomeModal(false);
                setIsDemoMode(true);
                setTimeout(() => {
                    setIsDemoMode(false);
                    setShowPremiumModal(true);
                }, 5 * 60 * 1000); // 5-minute demo
                gtag('event', 'try_now', {
                    'event_category': 'Engagement',
                    'event_label': 'Try Now Click'
                });
            };

            const handleDrag = (id, newX, newY) => {
                setPositions(prev => ({
                    ...prev,
                    [id]: { ...prev[id], x: newX, y: newY }
                }));
            };

            const savePlay = () => {
                if (!isPremium && !isDemoMode && savedPlays.length >= 1) {
                    setShowPremiumModal(true);
                    return;
                }
                if (playName) {
                    const newSavedPlays = [...savedPlays, { 
                        name: playName, 
                        positions: { ...positions }, 
                        lines: [...lines], 
                        notes: '' 
                    }];
                    setSavedPlays(newSavedPlays);
                    localStorage.setItem('savedPlays', JSON.stringify(newSavedPlays));
                    setPlayName('');
                    if (newSavedPlays.length > 5) {
                        alert('Warning: Local storage is limited. Consider upgrading to premium for cloud storage.');
                    }
                }
            };

            const loadPlay = (play) => {
                setPositions(play.positions);
                setLines(play.lines || []);
                setPlayName(play.name);
            };

            const deletePlay = (index) => {
                const newSavedPlays = savedPlays.filter((_, i) => i !== index);
                setSavedPlays(newSavedPlays);
                localStorage.setItem('savedPlays', JSON.stringify(newSavedPlays));
                resetPositions();
            };

            const sharePlay = (play) => {
                const playData = encodeURIComponent(JSON.stringify(play));
                const shareUrl = `${window.location.origin}?play=${playData}`;
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('Play URL copied to clipboard! Share it on Reddit or with your team.');
                });
                gtag('event', 'share_play', {
                    'event_category': 'Engagement',
                    'event_label': 'Share Play'
                });
            };

            const resetPositions = () => {
                setPositions(initialPositions);
                setLines([]);
                setDrawing(false);
                setCurrentLine(null);
                setIsSolidMode(false);
                setIsDottedMode(false);
                setPlayName('');
            };

            const toggleSolidMode = () => {
                if (!isPremium && !isDemoMode) {
                    setShowPremiumModal(true);
                    return;
                }
                setIsSolidMode(prev => {
                    const newState = !prev;
                    if (newState) setIsDottedMode(false);
                    return newState;
                });
            };

            const toggleDottedMode = () => {
                if (!isPremium && !isDemoMode) {
                    setShowPremiumModal(true);
                    return;
                }
                setIsDottedMode(prev => {
                    const newState = !prev;
                    if (newState) setIsSolidMode(false);
                    return newState;
                });
            };

            const handleMouseDown = (e) => {
                if (!isPremium && !isDemoMode || (!isSolidMode && !isDottedMode)) return;

                const svg = e.currentTarget;
                const { x, y } = getClientPosition(e);
                const pt = svg.createSVGPoint();
                pt.x = x;
                pt.y = y;
                const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                
                setDrawing(true);
                setCurrentLine({
                    start: { x: transformed.x, y: transformed.y },
                    end: { x: transformed.x, y: transformed.y },
                    type: isSolidMode ? 'solid' : 'dotted'
                });
                e.preventDefault();
            };

            const handleMouseMove = (e) => {
                if (drawing) {
                    const svg = document.querySelector('svg');
                    const { x, y } = getClientPosition(e);
                    const pt = svg.createSVGPoint();
                    pt.x = x;
                    pt.y = y;
                    const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                    
                    setCurrentLine(prev => ({
                        ...prev,
                        end: { x: transformed.x, y: transformed.y }
                    }));
                    e.preventDefault();
                }
            };

            const handleMouseUp = () => {
                if (drawing && currentLine) {
                    setLines(prev => [...prev, currentLine]);
                    setDrawing(false);
                    setCurrentLine(null);
                }
            };

            const undoLine = () => {
                setLines(prev => prev.slice(0, -1));
                setDrawing(false);
                setCurrentLine(null);
            };

            const resetLines = () => {
                setLines([]);
                setDrawing(false);
                setCurrentLine(null);
            };

            const handleGoPremium = async (plan) => {
                setIsLoading(true);
                setErrorMessage('');
                try {
                    const stripeInstance = await stripePromise;
                    let priceId, mode;
                    if (plan === 'monthly') {
                        priceId = 'price_1RBeSTB311TbF661Wzqqc3OW';
                        mode = 'subscription';
                    } else if (plan === 'annual') {
                        priceId = 'price_1RBeT4B311TbF661BchpXFF1';
                        mode = 'subscription';
                    } else if (plan === 'onetime') {
                        priceId = 'price_1RBoExB311TbF661pkuJDeP5';
                        mode = 'payment';
                    }
                    const result = await stripeInstance.redirectToCheckout({
                        lineItems: [{ price: priceId, quantity: 1 }],
                        mode: mode,
                        successUrl: window.location.href + '?premium_success=true',
                        cancelUrl: window.location.href
                    });
                    if (result.error) {
                        setErrorMessage(result.error.message);
                    }
                } catch (error) {
                    setErrorMessage('Failed to connect to payment system. Please try again later.');
                } finally {
                    setIsLoading(false);
                }
            };

            const openNotesModal = (index) => {
                if (!isPremium && !isDemoMode) {
                    setShowPremiumModal(true);
                    return;
                }
                setCurrentPlayIndex(index);
                setCurrentNotes(savedPlays[index].notes || '');
                setShowNotesModal(true);
            };

            const saveNotes = () => {
                if (currentPlayIndex !== null) {
                    const updatedPlays = [...savedPlays];
                    updatedPlays[currentPlayIndex] = { ...updatedPlays[currentPlayIndex], notes: currentNotes };
                    setSavedPlays(updatedPlays);
                    localStorage.setItem('savedPlays', JSON.stringify(updatedPlays));
                }
                setShowNotesModal(false);
                setCurrentPlayIndex(null);
                setCurrentNotes('');
            };

            useEffect(() => {
                if (window.location.search.includes('premium_success=true')) {
                    localStorage.setItem('isPremium', 'true');
                    setIsPremium(true);
                    setShowWelcomeModal(false);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
                const urlParams = new URLSearchParams(window.location.search);
                const playData = urlParams.get('play');
                if (playData) {
                    try {
                        const play = JSON.parse(decodeURIComponent(playData));
                        loadPlay(play);
                    } catch (e) {
                        console.error('Failed to load shared play:', e);
                    }
                }
            }, []);

            return (
                <div>
                    <div className="text-center mb-6">
                        <h1 className="text-3xl md:text-4xl font-bold text-gray-800">
                            Welcome to <span className="title-highlight">FieldCommand</span>
                        </h1>
                        <p className="text-base md:text-lg text-gray-600 mt-2">
                            Plan winning baseball strategies in seconds! ⚾ Drag players, draw plays, and share with your team.
                        </p>
                        <a 
                            href="https://reddit.com/r/baseballcoaching" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="inline-block mt-4 bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition"
                        >
                            Share Feedback on Reddit
                        </a>
                    </div>
                    {showWelcomeModal ? (
                        <div className="modal">
                            <div className="modal-content p-6">
                                <h2 className="text-xl font-bold mb-4">Try FieldCommand Free!</h2>
                                <p className="text-gray-600 mb-4">Create and save one play, or upgrade to premium for unlimited saves and advanced features.</p>
                                <button
                                    onClick={handleTryNow}
                                    className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition"
                                >
                                    Try Now
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="container p-4 md:p-6 w-full max-w-[1200px] flex flex-col md:flex-row gap-4 min-h-[600px]">
                            <div className="w-full md:w-1/4 p-4 flex flex-col gap-4 sidebar">
                                <div className="text-center">
                                    <h1 className="text-xl md:text-2xl font-bold title-highlight">FieldCommand</h1>
                                    <p className="text-sm text-gray-600 mt-1">Baseball Defense Planner</p>
                                    <p className="text-xs text-gray-500 mt-1">Plan Winning Defensive Strategies</p>
                                </div>
                                <input 
                                    type="text" 
                                    value={playName}
                                    onChange={(e) => setPlayName(e.target.value)}
                                    placeholder="Enter play name"
                                    className="border border-gray-300 p-3 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500"
                                    aria-label="Play name input"
                                />
                                <button 
                                    onClick={savePlay}
                                    className={`px-4 py-3 rounded-lg text-base ${isPremium || isDemoMode || savedPlays.length < 1 ? 'bg-green-600 text-white hover:bg-green-700' : 'bg-gray-400 text-gray-700 opacity-50 cursor-not-allowed'} transition`}
                                    aria-label="Save current play"
                                >
                                    Save Play {isPremium || isDemoMode ? '' : savedPlays.length < 1 ? '' : '(Premium)'}
                                </button>
                                <button 
                                    onClick={resetPositions}
                                    className="bg-gray-600 text-white px-4 py-3 rounded-lg text-base hover:bg-gray-700 transition"
                                    aria-label="Reset play to default"
                                >
                                    Reset Play
                                </button>
                                <button
                                    onClick={toggleSolidMode}
                                    className={`px-4 py-3 rounded-lg text-base ${isPremium || isDemoMode ? (isSolidMode ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-800') : 'bg-gray-400 text-gray-700 opacity-50 cursor-not-allowed'} hover:bg-green-700 hover:text-white transition`}
                                    aria-label="Toggle solid line drawing"
                                >
                                    Solid Line {isSolidMode ? '(On)' : '(Off)'} {isPremium || isDemoMode ? '' : '(Premium)'}
                                </button>
                                <button
                                    onClick={toggleDottedMode}
                                    className={`px-4 py-3 rounded-lg text-base ${isPremium || isDemoMode ? (isDottedMode ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-800') : 'bg-gray-400 text-gray-700 opacity-50 cursor-not-allowed'} hover:bg-green-700 hover:text-white transition`}
                                    aria-label="Toggle dotted line drawing"
                                >
                                    Dotted Line {isDottedMode ? '(On)' : '(Off)'} {isPremium || isDemoMode ? '' : '(Premium)'}
                                </button>
                                <div className="split-button">
                                    <button
                                        onClick={undoLine}
                                        className="bg-gray-600 text-white px-4 py-3 text-base hover:bg-gray-700 transition"
                                        aria-label="Undo last drawn line"
                                    >
                                        Undo
                                    </button>
                                    <button
                                        onClick={resetLines}
                                        className="bg-gray-600 text-white px-4 py-3 text-base hover:bg-gray-700 transition"
                                        aria-label="Reset all drawn lines"
                                    >
                                        Reset Lines
                                    </button>
                                </div>
                                {!isPremium && (
                                    <button
                                        onClick={() => setShowPremiumModal(true)}
                                        className="bg-blue-600 text-white px-4 py-3 rounded-lg text-base hover:bg-blue-700 transition"
                                        aria-label="Upgrade to premium"
                                    >
                                        Go Premium
                                    </button>
                                )}
                            </div>

                            <div className="flex-1 flex justify-center w-full">
                                <svg 
                                    width="100%" 
                                    height="100%" 
                                    viewBox="150 25 400 450" 
                                    preserveAspectRatio="xMidYMid meet"
                                    className="border rounded-lg svg-shadow w-full max-w-[600px] h-auto" 
                                    style={{ background: 'url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAAXNSR0IArs4c6QAAAERlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAACqADAAQAAAABAAAACgAAAAD8qP0qAAAAHUlEQVQY02NgYGD4TyZGMjIy/H8YGBgY/j8YGBgAOq4B9FHyHyYAAAAASUVORK5CYII=") repeat, rgba(0, 128, 0, 0.8)', touchAction: 'none' }} 
                                    onMouseDown={handleMouseDown}
                                    onMouseMove={handleMouseMove}
                                    onMouseUp={handleMouseUp}
                                    onTouchStart={handleMouseDown}
                                    onTouchMove={handleMouseMove}
                                    onTouchEnd={handleMouseUp}
                                    role="img"
                                    aria-label="Baseball field diagram"
                                >
                                    <defs>
                                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                                            <path d="M0,0 L0,6 L9,3 Z" fill="black" />
                                        </marker>
                                    </defs>
                                    <rect x="150" y="25" width="400" height="450" fill="rgba(0, 128, 0, 0.8)" />
                                    <path 
                                        d="M 350 425 L 200 275 Q 250 175 350 175 Q 450 175 500 275 L 350 425 Z" 
                                        fill="burlywood"
                                        stroke="white"
                                        strokeWidth="2"
                                    />
                                    <path 
                                        d="M 350 425 L 250 325 L 350 225 L 450 325 Z" 
                                        fill="rgba(0, 128, 0, 0.8)"
                                        stroke="white"
                                        strokeWidth="2"
                                    />
                                    <circle cx="350" cy="325" r="20" fill="burlywood" stroke="white" strokeWidth="2" />
                                    <rect x="340" y="320" width="20" height="5" fill="white" />
                                    <path 
                                        d="M 340 417 L 360 417 L 360 432 L 350 436 L 340 432 Z" 
                                        fill="white"
                                    />
                                    <rect x="240" y="315" width="15" height="15" fill="white" transform="rotate(45 250 325)" />
                                    <rect x="340" y="215" width="15" height="15" fill="white" transform="rotate(45 350 225)" />
                                    <rect x="440" y="315" width="15" height="15" fill="white" transform="rotate(45 450 325)" />
                                    <line x1="350" y1="425" x2="250" y2="325" stroke="white" strokeWidth="2" />
                                    <line x1="250" y1="325" x2="350" y2="225" stroke="white" strokeWidth="2" />
                                    <line x1="350" y1="225" x2="450" y2="325" stroke="white" strokeWidth="2" />
                                    <line x1="450" y1="325" x2="350" y2="425" stroke="white" strokeWidth="2" />
                                    {lines.map((line, index) => (
                                        <g key={index}>
                                            <line
                                                x1={line.start.x}
                                                y1={line.start.y}
                                                x2={line.end.x}
                                                y2={line.end.y}
                                                stroke="black"
                                                strokeWidth="2"
                                                strokeDasharray={line.type === 'dotted' ? '5,5' : 'none'}
                                                markerEnd="url(#arrow)"
                                            />
                                        </g>
                                    ))}
                                    {currentLine && (
                                        <g>
                                            <line
                                                x1={currentLine.start.x}
                                                y1={currentLine.start.y}
                                                x2={currentLine.end.x}
                                                y2={currentLine.end.y}
                                                stroke="black"
                                                strokeWidth="2"
                                                strokeDasharray={currentLine.type === 'dotted' ? '5,5' : 'none'}
                                                markerEnd="url(#arrow)"
                                            />
                                        </g>
                                    )}
                                    {Object.entries(positions).map(([id, { x, y, label }]) => (
                                        <DraggableMarker 
                                            key={id} 
                                            id={id} 
                                            x={x} 
                                            y={y} 
                                            label={label}
                                            color={id === 'baseball' ? 'white' : id.includes('runner') ? 'black' : 'red'}
                                            onDrag={handleDrag}
                                        />
                                    ))}
                                </svg>
                            </div>

                            <div className="w-full md:w-1/4 p-4 flex flex-col gap-4 sidebar">
                                <h2 className="text-lg font-semibold text-gray-800 text-center border-b border-gray-200 pb-2">Saved Plays</h2>
                                <div className="flex-1 overflow-y-auto">
                                    <div className="grid grid-cols-1 gap-2">
                                        {savedPlays.map((play, index) => (
                                            <div key={index} className="flex items-center gap-2 relative tooltip-container">
                                                <button 
                                                    onClick={() => loadPlay(play)}
                                                    className="flex-1 bg-blue-100 p-2 rounded-lg hover:bg-blue-200 text-sm truncate transition text-gray-800"
                                                    title={play.name}
                                                    aria-label={`Load play: ${play.name}`}
                                                >
                                                    {play.name}
                                                </button>
                                                <button 
                                                    onClick={() => openNotesModal(index)}
                                                    className="bg-yellow-500 text-white px-2 py-1 rounded-lg text-sm hover:bg-yellow-600 transition"
                                                    aria-label={`Edit notes for play: ${play.name}`}
                                                >
                                                    📝
                                                </button>
                                                {play.notes && (
                                                    <span className="tooltip">{play.notes}</span>
                                                )}
                                                <button 
                                                    onClick={() => sharePlay(play)}
                                                    className="bg-green-500 text-white px-2 py-1 rounded-lg text-sm hover:bg-green-600 transition"
                                                    aria-label={`Share play: ${play.name}`}
                                                >
                                                    Share
                                                </button>
                                                <button 
                                                    onClick={() => deletePlay(index)}
                                                    className="bg-red-600 text-white px-2 py-1 rounded-lg text-sm hover:bg-red-700 transition"
                                                    aria-label={`Delete play: ${play.name}`}
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {showPremiumModal && (
                                <div className="modal">
                                    <div className="modal-content p-6">
                                        <h2 className="text-xl font-bold mb-4">Upgrade to Premium</h2>
                                        <p className="text-gray-600 mb-4">Unlock unlimited saves, drawing lines, notes, and cloud storage!</p>
                                        {errorMessage && (
                                            <p className="text-red-600 mb-4">{errorMessage}</p>
                                        )}
                                        <button
                                            onClick={() => handleGoPremium('monthly')}
                                            className="block mx-auto bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition mb-2 disabled:opacity-50"
                                            disabled={isLoading}
                                            aria-label="Subscribe to monthly plan"
                                        >
                                            {isLoading ? <span className="loading-spinner"></span> : '$4.99/month'}
                                        </button>
                                        <button
                                            onClick={() => handleGoPremium('annual')}
                                            className="block mx-auto bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition mb-2 disabled:opacity-50"
                                            disabled={isLoading}
                                            aria-label="Subscribe to annual plan"
                                        >
                                            {isLoading ? <span className="loading-spinner"></span> : '$39.99/year (Save 33%)'}
                                        </button>
                                        <button
                                            onClick={() => handleGoPremium('onetime')}
                                            className="block mx-auto bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition mb-2 disabled:opacity-50"
                                            disabled={isLoading}
                                            aria-label="Purchase one-time full access"
                                        >
                                            {isLoading ? <span className="loading-spinner"></span> : '$74.99 One-Time Full Access'}
                                        </button>
                                        <div className="flex justify-center mt-4">
                                            <button
                                                onClick={() => setShowPremiumModal(false)}
                                                className="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition"
                                                aria-label="Cancel premium upgrade"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {showNotesModal && (
                                <div className="modal">
                                    <div className="modal-content p-6">
                                        <h2 className="text-xl font-bold mb-4">Play Notes</h2>
                                        <textarea
                                            value={currentNotes}
                                            onChange={(e) => setCurrentNotes(e.target.value)}
                                            placeholder="Add notes (e.g., 2 outs, runner on 3rd)"
                                            className="border border-gray-300 p-3 rounded-lg text-base w-full h-32 resize-none focus:outline-none focus:ring-2 focus:ring-green-500 mb-4"
                                            aria-label="Play notes input"
                                        />
                                        <div className="flex justify-center gap-4">
                                            <button
                                                onClick={saveNotes}
                                                className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition"
                                                aria-label="Save play notes"
                                            >
                                                Save Notes
                                            </button>
                                            <button
                                                onClick={() => setShowNotesModal(false)}
                                                className="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition"
                                                aria-label="Cancel notes"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BaseballField />);
    </script>
</body>
</html>
