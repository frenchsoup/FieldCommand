<body class="min-h-screen flex items-center justify-center">
    <div id="loading" class="fixed inset-0 flex items-center justify-center bg-white">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-green-600"></div>

    <div class="w-full max-w-[1200px] mx-auto p-4 md:p-6">
        <div id="root" role="application" aria-label="FieldCommand Baseball Defense Planner"></div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCrSN8xc3KTGrc2gUzcqerL6SSYrF3LXZM",
            authDomain: "fieldcommand.firebaseapp.com",
            projectId: "fieldcommand",
            storageBucket: "fieldcommand.firebasestorage.app",
            messagingSenderId: "944064034218",
            appId: "1:944064034218:web:bb6744acdd0d66e9ba27d3",
            measurementId: "G-C3TQ7DWTX8"
        };

        let app, db, auth;
        try {
            app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            console.log("Firebase initialized successfully");
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }

        let stripe;
        const stripePromise = new Promise((resolve) => {
            const checkStripe = () => {
                if (window.Stripe) {
                    stripe = window.Stripe('pk_test_51RBeP6B311TbF66104ceu6MjOAU7FBEHtNyrCccF93ZJNgj4QGQPirUo28iyaWewu6xX9frkQrEwCR2kVdQb5XrC00aNVEvPJ5');
                    resolve(stripe);
                } else {
                    setTimeout(checkStripe, 100);
                }
            };
            checkStripe();
        });

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const initialPositions = {
            pitcher: { x: 350, y: 308, label: 'P' },
            catcher: { x: 350, y: 455, label: 'C' },
            first: { x: 450, y: 275, label: '1B' },
            second: { x: 400, y: 205, label: '2B' },
            third: { x: 250, y: 275, label: '3B' },
            shortstop: { x: 300, y: 205, label: 'SS' },
            left: { x: 225, y: 125, label: 'LF' },
            center: { x: 350, y: 75, label: 'CF' },
            right: { x: 475, y: 125, label: 'RF' },
            baseball: { x: 450, y: 410, label: '⚾' },
            runner1: { x: 485, y: 410, label: 'BR' },
            runner2: { x: 520, y: 410, label: 'BR' },
            runner3: { x: 485, y: 445, label: 'BR' },
            runner4: { x: 520, y: 445, label: 'BR' }
        };

        function DraggableMarker({ id, x, y, label, color, onDrag }) {
            const [isDragging, setIsDragging] = useState(false);

            const getClientPosition = (e) => {
                const isTouch = e.type.startsWith('touch');
                return {
                    x: isTouch ? e.touches[0].clientX : e.clientX,
                    y: isTouch ? e.touches[0].clientY : e.clientY
                };
            };

            const handleStart = (e) => {
                setIsDragging(true);
                e.preventDefault();
                e.stopPropagation();
            };

            const handleMove = React.useCallback((e) => {
                if (isDragging) {
                    const { x, y } = getClientPosition(e);
                    const svg = document.querySelector('svg');
                    const pt = svg.createSVGPoint();
                    pt.x = x;
                    pt.y = y;
                    const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                    onDrag(id, transformed.x, transformed.y);
                    e.preventDefault();
                }
            }, [isDragging, id, onDrag]);

            const handleEnd = React.useCallback((e) => {
                setIsDragging(false);
                e.preventDefault();
            }, []);

            useEffect(() => {
                if (isDragging) {
                    document.addEventListener('mousemove', handleMove);
                    document.addEventListener('mouseup', handleEnd);
                    document.addEventListener('touchmove', handleMove, { passive: false });
                    document.addEventListener('touchend', handleEnd);
                }
                return () => {
                    document.removeEventListener('mousemove', handleMove);
                    document.removeEventListener('mouseup', handleEnd);
                    document.removeEventListener('touchmove', handleMove);
                    document.removeEventListener('touchend', handleEnd);
                };
            }, [isDragging, handleMove, handleEnd]);

            return (
                <g 
                    onMouseDown={handleStart} 
                    onTouchStart={handleStart} 
                    className="cursor-move touch-none"
                    tabIndex="0"
                    role="button"
                    aria-label={`${label} marker at position ${x},${y}`}
                >
                    <circle 
                        cx={x} 
                        cy={y} 
                        r={id === 'baseball' ? 10 : 15} 
                        fill={color} 
                        stroke="white" 
                        strokeWidth="2"
                    />
                    {label && (
                        <text 
                            x={x} 
                            y={y + (id === 'baseball' ? 4 : 5)} 
                            textAnchor="middle" 
                            fill="white" 
                            fontSize={id === 'baseball' ? 14 : 12}
                        >
                            {label}
                        </text>
                    )}
                </g>
            );
        }

        function BaseballField() {
            const [positions, setPositions] = useState(initialPositions);
            const [playName, setPlayName] = useState('');
            const [savedPlays, setSavedPlays] = useState([]);
            const [isSolidMode, setIsSolidMode] = useState(false);
            const [isDottedMode, setIsDottedMode] = useState(false);
            const [drawing, setDrawing] = useState(false);
            const [currentLine, setCurrentLine] = useState(null);
            const [lines, setLines] = useState([]);
            const [showPremiumModal, setShowPremiumModal] = useState(false);
            const [showNotesModal, setShowNotesModal] = useState(false);
            const [currentPlayIndex, setCurrentPlayIndex] = useState(null);
            const [currentNotes, setCurrentNotes] = useState('');
            const [isPremium, setIsPremium] = useState(localStorage.getItem('isPremium') === 'true');
            const [showEmailGate, setShowEmailGate] = useState(
                localStorage.getItem('fieldCommandUnlocked') !== 'true' && !isPremium
            );
            const [error, setError] = useState(null);

            useEffect(() => {
                if (!app || !db || !auth) {
                    setError("Firebase not initialized. Check console for details.");
                    return;
                }

                auth.signInAnonymously()
                    .then((userCredential) => {
                        console.log("Signed in anonymously with UID:", userCredential.user.uid);
                        const userId = userCredential.user.uid;
                        db.collection('users').doc(userId).collection('plays')
                            .onSnapshot((querySnapshot) => {
                                const plays = [];
                                querySnapshot.forEach((doc) => {
                                    plays.push(doc.data());
                                });
                                setSavedPlays(plays);
                                document.getElementById('loading').style.display = 'none';
                                console.log("Plays loaded:", plays);
                            }, (error) => {
                                console.error('Error loading plays:', error);
                                setError("Failed to load plays: " + error.message);
                            });
                    })
                    .catch((error) => {
                        console.error('Error signing in anonymously:', error);
                        setError("Authentication failed: " + error.message);
                    });
            }, []);

            const getClientPosition = (e) => {
                const isTouch = e.type.startsWith('touch');
                return {
                    x: isTouch ? e.touches[0].clientX : e.clientX,
                    y: isTouch ? e.touches[0].clientY : e.clientY
                };
            };

            const triggerPremiumModal = () => {
                gtag('event', 'premium_modal_view', {
                    'event_category': 'Premium',
                    'event_label': 'Premium Modal Displayed'
                });
                setShowPremiumModal(true);
            };

            const handleEmailSubmit = async (e) => {
                e.preventDefault();
                const email = e.target.querySelector('#unlock-email').value;
                const errorMessage = e.target.querySelector('#email-error');

                if (!emailRegex.test(email)) {
                    errorMessage.style.display = 'block';
                    return;
                }

                errorMessage.style.display = 'none';

                gtag('event', 'unlock_app_attempt', {
                    'event_category': 'Engagement',
                    'event_label': 'Email Submission Attempt'
                });

                const formData = new FormData();
                formData.append('EMAIL', email);
                formData.append('b_c3a7558bf8ddc22b2955671f5_1130a67a8c', '');

                try {
                    await fetch('https://us20.list-manage.com/subscribe/post?u=c3a7558bf8ddc22b2955671f5&id=1130a67a8c&f_id=0076c2edf0', {
                        method: 'POST',
                        body: formData,
                        mode: 'no-cors'
                    });
                    alert('Thanks for signing up! You can now use FieldCommand.');
                    gtag('event', 'unlock_app_success', {
                        'event_category': 'Engagement',
                        'event_label': 'Email Submission Success',
                        'value': 1
                    });
                } catch (error) {
                    console.error('Error submitting to Mailchimp:', error);
                    alert('Something went wrong. Please try again.');
                    gtag('event', 'unlock_app_error', {
                        'event_category': 'Engagement',
                        'event_label': 'Email Submission Error'
                    });
                }

                localStorage.setItem('fieldCommandUnlocked', 'true');
                setShowEmailGate(false);
            };

            const handleDrag = (id, newX, newY) => {
                setPositions(prev => ({
                    ...prev,
                    [id]: { ...prev[id], x: newX, y: newY }
                }));
            };

            const savePlay = () => {
                if (!isPremium) {
                    triggerPremiumModal();
                    return;
                }
                if (playName) {
                    const newPlay = { 
                        name: playName, 
                        positions: { ...positions }, 
                        lines: [...lines], 
                        notes: '' 
                    };
                    const newSavedPlays = [...savedPlays, newPlay];
                    setSavedPlays(newSavedPlays);
                    if (auth.currentUser) {
                        db.collection('users').doc(auth.currentUser.uid).collection('plays').doc(playName).set(newPlay)
                            .then(() => console.log("Play saved:", playName))
                            .catch((error) => console.error('Error saving play:', error));
                    }
                    setPlayName('');
                }
            };

            const loadPlay = (play) => {
                setPositions(play.positions);
                setLines(play.lines || []);
                setPlayName(play.name);
            };

            const deletePlay = (index) => {
                const playToDelete = savedPlays[index];
                const newSavedPlays = savedPlays.filter((_, i) => i !== index);
                setSavedPlays(newSavedPlays);
                if (auth.currentUser) {
                    db.collection('users').doc(auth.currentUser.uid).collection('plays').doc(playToDelete.name).delete()
                        .then(() => console.log("Play deleted:", playToDelete.name))
                        .catch((error) => console.error('Error deleting play:', error));
                }
                resetPositions();
            };

            const resetPositions = () => {
                setPositions(initialPositions);
                setLines([]);
                setDrawing(false);
                setCurrentLine(null);
                setIsSolidMode(false);
                setIsDottedMode(false);
                setPlayName('');
            };

            const toggleSolidMode = () => {
                if (!isPremium) {
                    triggerPremiumModal();
                    return;
                }
                setIsSolidMode(prev => {
                    const newState = !prev;
                    if (newState) setIsDottedMode(false);
                    return newState;
                });
            };

            const toggleDottedMode = () => {
                if (!isPremium) {
                    triggerPremiumModal();
                    return;
                }
                setIsDottedMode(prev => {
                    const newState = !prev;
                    if (newState) setIsSolidMode(false);
                    return newState;
                });
            };

            const handleMouseDown = (e) => {
                if (!isPremium || (!isSolidMode && !isDottedMode)) return;

                const svg = e.currentTarget;
                const { x, y } = getClientPosition(e);
                const pt = svg.createSVGPoint();
                pt.x = x;
                pt.y = y;
                const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                
                setDrawing(true);
                setCurrentLine({
                    start: { x: transformed.x, y: transformed.y },
                    end: { x: transformed.x, y: transformed.y },
                    type: isSolidMode ? 'solid' : 'dotted'
                });
                e.preventDefault();
            };

            const handleMouseMove = (e) => {
                if (drawing) {
                    const svg = document.querySelector('svg');
                    const { x, y } = getClientPosition(e);
                    const pt = svg.createSVGPoint();
                    pt.x = x;
                    pt.y = y;
                    const transformed = pt.matrixTransform(svg.getScreenCTM().inverse());
                    
                    setCurrentLine(prev => ({
                        ...prev,
                        end: { x: transformed.x, y: transformed.y }
                    }));
                    e.preventDefault();
                }
            };

            const handleMouseUp = () => {
                if (drawing && currentLine) {
                    setLines(prev => [...prev, currentLine]);
                    setDrawing(false);
                    setCurrentLine(null);
                }
            };

            const undoLine = () => {
                setLines(prev => prev.slice(0, -1));
                setDrawing(false);
                setCurrentLine(null);
            };

            const resetLines = () => {
                setLines([]);
                setDrawing(false);
                setCurrentLine(null);
            };

            const handleGoPremium = async (plan) => {
                gtag('event', 'premium_interest', {
                    'event_category': 'Premium',
                    'event_label': `Go Premium Clicked - ${plan}`,
                    'value': plan === 'monthly' ? 4.99 : plan === 'annual' ? 39.99 : 74.99
                });

                try {
                    const stripeInstance = await stripePromise;
                    let priceId, mode;
                    if (plan === 'monthly') {
                        priceId = 'price_1RBeSTB311TbF661Wzqqc3OW';
                        mode = 'subscription';
                    } else if (plan === 'annual') {
                        priceId = 'price_1RBeT4B311TbF661BchpXFF1';
                        mode = 'subscription';
                    } else if (plan === 'onetime') {
                        priceId = 'price_1RBoExB311TbF661pkuJDeP5';
                        mode = 'payment';
                    }
                    localStorage.setItem('lastPremiumPlan', plan);
                    const result = await stripeInstance.redirectToCheckout({
                        lineItems: [{ price: priceId, quantity: 1 }],
                        mode: mode,
                        successUrl: window.location.href + '?premium_success=true',
                        cancelUrl: window.location.href
                    });
                    if (result.error) {
                        console.error('Stripe checkout error:', result.error.message);
                        alert('Failed to initiate checkout: ' + result.error.message);
                    }
                } catch (error) {
                    console.error('Error in handleGoPremium:', error);
                    alert('An error occurred while processing your request. Please try again.');
                }
            };

            const openNotesModal = (index) => {
                if (!isPremium) {
                    triggerPremiumModal();
                    return;
                }
                setCurrentPlayIndex(index);
                setCurrentNotes(savedPlays[index].notes || '');
                setShowNotesModal(true);
            };

            const saveNotes = () => {
                if (currentPlayIndex !== null) {
                    const updatedPlays = [...savedPlays];
                    updatedPlays[currentPlayIndex] = { ...updatedPlays[currentPlayIndex], notes: currentNotes };
                    setSavedPlays(updatedPlays);
                    if (auth.currentUser) {
                        db.collection('users').doc(auth.currentUser.uid).collection('plays').doc(updatedPlays[currentPlayIndex].name).set(updatedPlays[currentPlayIndex])
                            .then(() => console.log("Notes saved for:", updatedPlays[currentPlayIndex].name))
                            .catch((error) => console.error('Error saving notes:', error));
                    }
                }
                setShowNotesModal(false);
                setCurrentPlayIndex(null);
                setCurrentNotes('');
            };

            useEffect(() => {
                if (window.location.search.includes('premium_success=true')) {
                    gtag('event', 'purchase', {
                        'event_category': 'Ecommerce',
                        'event_label': 'Premium Purchase',
                        'value': localStorage.getItem('lastPremiumPlan') === 'monthly' ? 4.99 : localStorage.getItem('lastPremiumPlan') === 'annual' ? 39.99 : 74.99,
                        'currency': 'USD'
                    });
                    localStorage.setItem('isPremium', 'true');
                    setIsPremium(true);
                    setShowEmailGate(false);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }, []);

            if (error) {
                return (
                    <div className="text-center text-red-600">
                        <h1>Error</h1>
                        <p>{error}</p>
                        <p>Check the console (F12) for more details.</p>
                    </div>
                );
            }

            return (
                <div>
                    <div className="text-center mb-6">
                        <h1 className="text-3xl md:text-4xl font-bold text-gray-800">
                            Welcome to <span className="title-highlight">FieldCommand</span>
                        </h1>
                        <p className="text-base md:text-lg text-gray-600 mt-2">
                            The ultimate baseball defense planner for coaches. Position players, draw plays, and save strategies—all in one tool.
                        </p>
                    </div>
                    {showEmailGate ? (
                        <div className="max-w-md mx-auto">
                            <form onSubmit={handleEmailSubmit} className="validate" noValidate>
                                <label htmlFor="unlock-email" className="sr-only">Email</label>
                                <input 
                                    type="email" 
                                    name="EMAIL" 
                                    id="unlock-email" 
                                    defaultValue=""
                                    className="border border-gray-300 p-3 rounded-lg w-full mb-4 text-base focus:outline-none focus:ring-2 focus:ring-green-500" 
                                    placeholder="Enter your email to try free" 
                                    required 
                                />
                                <p id="email-error" className="error-message">Please enter a valid email address (e.g., user@domain.com).</p>
                                <div style={{ position: 'absolute', left: '-5000px' }} aria-hidden="true">
                                    <input type="text" name="b_c3a7558bf8ddc22b2955671f5_1130a67a8c" tabIndex="-1" defaultValue="" />
                                </div>
                                <input 
                                    type="submit" 
                                    value="Start Planning" 
                                    className="bg-green-600 text-white px-6 py-3 rounded-lg w-full text-base hover:bg-green-700 transition cursor-pointer" 
                                />
                            </form>
                            <p className="text-sm text-gray-500 mt-2">No credit card required—just your email to get started.</p>
                        </div>
                    ) : (
                        <div className="container p-4 md:p-6 w-full max-w-[1200px] flex flex-col md:flex-row gap-4 min-h-[600px]">
                            <div className="w-full md:w-1/4 p-4 flex flex-col gap-4 sidebar">
                                <div className="text-center">
                                    <h1 className="text-xl md:text-2xl font-bold title-highlight">FieldCommand</h1>
                                    <p className="text-sm text-gray-600 mt-1">Baseball Defense Planner</p>
                                    <p className="text-xs text-gray-500 mt-1">Plan Winning Defensive Strategies</p>
                                </div>
                                <input 
                                    type="text" 
                                    value={playName}
                                    onChange={(e) => setPlayName(e.target.value)}
                                    placeholder="Enter play name"
                                    className="border border-gray-300 p-3 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500"
                                />
                                <button 
                                    onClick={savePlay}
                                    className={`px-4 py-3 rounded-lg text-base ${isPremium ? 'bg-green-600 text-white hover:bg-green-700' : 'bg-gray-400 text-gray-700 opacity-50 cursor-not-allowed'} transition`}
                                >
                                    Save Play {isPremium ? '' : '(Premium)'}
                                </button>
                                <button 
                                    onClick={resetPositions}
                                    className="bg-gray-600 text-white px-4 py-3 rounded-lg text-base hover:bg-gray-700 transition"
                                >
                                    Reset Play
                                </button>
                                <button
                                    onClick={toggleSolidMode}
                                    className={`px-4 py-3 rounded-lg text-base ${isPremium ? (isSolidMode ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-800') : 'bg-gray-400 text-gray-700 opacity-50 cursor-not-allowed'} hover:bg-green-700 hover:text-white transition`}
                                >
                                    Solid Line {isSolidMode ? '(On)' : '(Off)'} {isPremium ? '' : '(Premium)'}
                                </button>
                                <button
                                    onClick={toggleDottedMode}
                                    className={`px-4 py-3 rounded-lg text-base ${isPremium ? (isDottedMode ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-800') : 'bg-gray-400 text-gray-700 opacity-50 cursor-not-allowed'} hover:bg-green-700 hover:text-white transition`}
                                >
                                    Dotted Line {isDottedMode ? '(On)' : '(Off)'} {isPremium ? '' : '(Premium)'}
                                </button>
                                <div className="split-button">
                                    <button
                                        onClick={undoLine}
                                        className="bg-gray-600 text-white px-4 py-3 text-base hover:bg-gray-700 transition"
                                    >
                                        Undo
                                    </button>
                                    <button
                                        onClick={resetLines}
                                        className="bg-gray-600 text-white px-4 py-3 text-base hover:bg-gray-700 transition"
                                    >
                                        Reset Lines
                                    </button>
                                </div>
                                {!isPremium && (
                                    <button
                                        onClick={() => setShowPremiumModal(true)}
                                        className="bg-blue-600 text-white px-4 py-3 rounded-lg text-base hover:bg-blue-700 transition"
                                    >
                                        Go Premium
                                    </button>
                                )}
                            </div>

                            <div className="flex-1 flex justify-center w-full">
                                <svg 
                                    width="100%" 
                                    height="100%" 
                                    viewBox="150 25 400 450" 
                                    preserveAspectRatio="xMidYMid meet"
                                    className="border rounded-lg svg-shadow w-full max-w-[600px] h-auto" 
                                    style={{ backgroundColor: 'rgba(0, 128, 0, 0.8)', touchAction: 'none' }} 
                                    onMouseDown={handleMouseDown}
                                    onMouseMove={handleMouseMove}
                                    onMouseUp={handleMouseUp}
                                    onTouchStart={handleMouseDown}
                                    onTouchMove={handleMouseMove}
                                    onTouchEnd={handleMouseUp}
                                >
                                    <defs>
                                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                                            <path d="M0,0 L0,6 L9,3 Z" fill="black" />
                                        </marker>
                                    </defs>
                                    <path 
                                        d="M 350 425 L 200 275 Q 250 175 350 175 Q 450 175 500 275 L 350 425 Z" 
                                        fill="burlywood"
                                    />
                                    <path 
                                        d="M 350 425 L 250 325 L 350 225 L 450 325 Z" 
                                        fill="rgba(0, 128, 0, 0.8)"
                                    />
                                    <circle cx="350" cy="325" r="20" fill="burlywood" />
                                    <rect x="340" y="320" width="20" height="5" fill="white" />
                                    <path 
                                        d="M 340 417 L 360 417 L 360 432 L 350 436 L 340 432 Z" 
                                        fill="white"
                                    />
                                    <rect x="240" y="315" width="15" height="15" fill="white" transform="rotate(45 250 325)" />
                                    <rect x="340" y="215" width="15" height="15" fill="white" transform="rotate(45 350 225)" />
                                    <rect x="440" y="315" width="15" height="15" fill="white" transform="rotate(45 450 325)" />
                                    <line x1="350" y1="425" x2="250" y2="325" stroke="white" strokeWidth="2" />
                                    <line x1="250" y1="325" x2="350" y2="225" stroke="white" strokeWidth="2" />
                                    <line x1="350" y1="225" x2="450" y2="325" stroke="white" strokeWidth="2" />
                                    <line x1="450" y1="325" x2="350" y2="425" stroke="white" strokeWidth="2" />
                                    {lines.map((line, index) => (
                                        <g key={index}>
                                            <line
                                                x1={line.start.x}
                                                y1={line.start.y}
                                                x2={line.end.x}
                                                y2={line.end.y}
                                                stroke="black"
                                                strokeWidth="2"
                                                strokeDasharray={line.type === 'dotted' ? '5,5' : 'none'}
                                                markerEnd="url(#arrow)"
                                            />
                                        </g>
                                    ))}
                                    {currentLine && (
                                        <g>
                                            <line
                                                x1={currentLine.start.x}
                                                y1={currentLine.start.y}
                                                x2={currentLine.end.x}
                                                y2={currentLine.end.y}
                                                stroke="black"
                                                strokeWidth="2"
                                                strokeDasharray={currentLine.type === 'dotted' ? '5,5' : 'none'}
                                                markerEnd="url(#arrow)"
                                            />
                                        </g>
                                    )}
                                    {Object.entries(positions).map(([id, { x, y, label }]) => (
                                        <DraggableMarker 
                                            key={id} 
                                            id={id} 
                                            x={x} 
                                            y={y} 
                                            label={label}
                                            color={id === 'baseball' ? 'white' : id.includes('runner') ? 'black' : 'red'}
                                            onDrag={handleDrag}
                                        />
                                    ))}
                                </svg>
                            </div>

                            <div className="w-full md:w-1/4 p-4 flex flex-col gap-4 sidebar">
                                <h2 className="text-lg font-semibold text-gray-800 text-center border-b border-gray-200 pb-2">Saved Plays</h2>
                                <div className="flex-1 overflow-y-auto">
                                    <div className="grid grid-cols-1 gap-2">
                                        {savedPlays.map((play, index) => (
                                            <div key={index} className="flex items-center gap-2 relative tooltip-container">
                                                <button 
                                                    onClick={() => loadPlay(play)}
                                                    className="flex-1 bg-blue-100 p-2 rounded-lg hover:bg-blue-200 text-sm truncate transition text-gray-800"
                                                    title={play.name}
                                                >
                                                    {play.name}
                                                </button>
                                                <button 
                                                    onClick={() => openNotesModal(index)}
                                                    className="bg-yellow-500 text-white px-2 py-1 rounded-lg text-sm hover:bg-yellow-600 transition"
                                                >
                                                    📝
                                                </button>
                                                {play.notes && (
                                                    <span className="tooltip">{play.notes}</span>
                                                )}
                                                <button 
                                                    onClick={() => deletePlay(index)}
                                                    className="bg-red-600 text-white px-2 py-1 rounded-lg text-sm hover:bg-red-700 transition"
                                                >
                                                    Delete
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {showPremiumModal && (
                                <div className="modal">
                                    <div className="modal-content p-6">
                                        <h2 className="text-xl font-bold mb-4">Upgrade to Premium</h2>
                                        <p className="text-gray-600 mb-4">Unlock saving plays, drawing lines, and adding notes!</p>
                                        <button
                                            onClick={() => handleGoPremium('monthly')}
                                            className="block mx-auto bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition mb-2"
                                        >
                                            $4.99/month
                                        </button>
                                        <button
                                            onClick={() => handleGoPremium('annual')}
                                            className="block mx-auto bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition mb-2"
                                        >
                                            $39.99/year (Save 33%)
                                        </button>
                                        <button
                                            onClick={() => handleGoPremium('onetime')}
                                            className="block mx-auto bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition mb-2"
                                        >
                                            $74.99 One-Time Full Access
                                        </button>
                                        <div className="flex justify-center mt-4">
                                            <button
                                                onClick={() => setShowPremiumModal(false)}
                                                className="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {showNotesModal && (
                                <div className="modal">
                                    <div className="modal-content p-6">
                                        <h2 className="text-xl font-bold mb-4">Play Notes</h2>
                                        <textarea
                                            value={currentNotes}
                                            onChange={(e) => setCurrentNotes(e.target.value)}
                                            placeholder="Add notes (e.g., 2 outs, runner on 3rd)"
                                            className="border border-gray-300 p-3 rounded-lg text-base w-full h-32 resize-none focus:outline-none focus:ring-2 focus:ring-green-500 mb-4"
                                        />
                                        <div className="flex justify-center gap-4">
                                            <button
                                                onClick={saveNotes}
                                                className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition"
                                            >
                                                Save Notes
                                            </button>
                                            <button
                                                onClick={() => setShowNotesModal(false)}
                                                className="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BaseballField />);
    </script>
</body>
</html>
